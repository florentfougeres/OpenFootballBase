name: Deploy site

# D9 : le site est publié avec les données de la DERNIÈRE release GitHub du dépôt de données (OpenFootballBase-Data).
# Un navigateur ne peut pas lire un asset de release directement (pas de CORS) : on le télécharge
# ici, côté serveur, et on le sert depuis le même domaine que la page.
# Une release du dépôt de données lance ce workflow via .github/workflows/notify-site.yml de ce dépôt (jeton SITE_DEPLOY_TOKEN),
# en donnant son tag ; lancé à la main sans tag, ou par un push de web/**, on prend la dernière release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release de données (data-X.Y.Z) ; vide = la dernière"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download data from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          # Lancé par la release du dépôt de données : on prend CETTE release (« la dernière » peut ne pas encore être celle qui vient d'être publiée).
          # Lancé à la main sans tag ou par un push : la dernière release.
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in ""|data-[0-9]*) ;; *) echo "tag invalide : $RELEASE_TAG"; exit 1 ;; esac
          gh release download ${RELEASE_TAG:+"$RELEASE_TAG"} --repo florentfougeres/OpenFootballBase-Data --pattern "*-data.tar.gz" --dir "$RUNNER_TEMP"
          archive=$(ls "$RUNNER_TEMP"/*-data.tar.gz)
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then echo "archive suspecte (chemin absolu ou « .. »)"; exit 1; fi
          mkdir -p web/public/data
          tar -xzf "$archive" --no-same-owner -C web/public/data
          test -s web/public/data/manifest.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web/dist
      # Le listing des artefacts de GitHub met parfois quelques secondes à voir l'artefact qui vient d'être finalisé :
      # sans cette attente, deploy-pages le cherche trop tôt et répond « Found 0 artifact(s) » (échec au hasard, une relance passait ou non).
      - name: Wait for the artifact to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
